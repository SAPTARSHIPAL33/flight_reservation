<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — AeroBook</title>
  <meta name="description" content="View and manage your AeroBook flight bookings." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              300: '#8ec1ff', 400: '#599fff', 500: '#3478ff',
              600: '#1b57f5', 700: '#1443e1',
            },
            surface: {
              200: '#e2e8f0', 800: '#1e293b',
              900: '#0f172a', 950: '#020617',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .page-bg {
      background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #142057 100%);
      min-height: 100vh;
    }

    .page-bg::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 25%, rgba(52, 120, 255, 0.10) 0%, transparent 50%),
        radial-gradient(circle at 85% 75%, rgba(89, 159, 255, 0.07) 0%, transparent 45%);
      pointer-events: none;
    }

    /* Spinner */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(52, 120, 255, 0.2);
      border-top-color: #3478ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Booking card entrance */
    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Toast initial state */
    #toast {
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }
  </style>
</head>

<body class="page-bg text-white">

  <!-- ════════════════════ NAVBAR ════════════════════ -->
  <nav class="fixed top-0 inset-x-0 z-50 glass border-b border-white/5">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

      <!-- Brand -->
      <a href="index.html" id="brand-logo" class="flex items-center gap-2">
        <div
          class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/25">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M6 12L3.269 3.125A59.768 59.768 0 0121.485 12 59.768 59.768 0 013.27 20.875L5.999 12zm0 0h7.5" />
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight">Aero<span class="text-brand-400">Book</span></span>
      </a>

      <!-- Nav Actions -->
      <div class="flex items-center gap-3">
        <a href="admin.html" id="link-admin"
          class="hidden items-center gap-1.5 px-4 py-2 text-sm font-semibold text-amber-300 border border-amber-500/30 bg-amber-500/10 hover:bg-amber-500/20 rounded-lg transition-all duration-200">
          Admin Portal
        </a>
        <a href="index.html" id="link-search"
          class="hidden sm:flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-slate-300 hover:text-white border border-white/10 hover:border-white/25 rounded-lg transition-all duration-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
          </svg>
          Search Flights
        </a>
        <button id="btn-logout"
          class="flex items-center gap-1.5 px-4 py-2 text-sm font-semibold text-red-300 border border-red-500/20 hover:bg-red-500/10 hover:border-red-500/40 rounded-lg transition-all duration-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Logout
        </button>
      </div>

    </div>
  </nav>

  <!-- ════════════════════ MAIN CONTENT ════════════════════ -->
  <main class="max-w-7xl mx-auto px-6 pt-28 pb-20 relative z-10">

    <!-- Profile / Welcome Banner -->
    <div class="glass rounded-2xl p-7 mb-10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-5">
      <div class="flex items-center gap-5">
        <!-- Avatar -->
        <div
          class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-xl shadow-brand-500/20 shrink-0">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <div>
          <p class="text-xs font-semibold uppercase tracking-widest text-brand-400 mb-1">Passenger</p>
          <h1 class="text-xl font-bold text-white">Welcome to your Dashboard</h1>
          <p class="text-sm text-slate-400 mt-0.5">Manage your flights and bookings below.</p>
        </div>
      </div>

      <!-- Quick link -->
      <a href="index.html"
        class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 rounded-xl shadow-lg shadow-brand-600/25 transition-all shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
        </svg>
        Search Flights
      </a>
    </div>

    <!-- My Bookings Section -->
    <section id="bookings-section">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-2xl font-bold text-white">My Bookings</h2>
          <p class="text-sm text-slate-400 mt-1">All your tickets in one place</p>
        </div>
        <button onclick="loadBookings()"
          class="flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-slate-300 hover:text-white border border-white/10 hover:border-white/25 rounded-lg transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Refresh
        </button>
      </div>

      <!-- Bookings will be rendered here by dashboard.js -->
      <div id="bookings-container"></div>
    </section>

  </main>

  <!-- ════════════════════ TOAST ════════════════════ -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ════════════════════ FOOTER ════════════════════ -->
  <footer class="border-t border-white/5 py-8 text-center text-xs text-slate-600">
    <p>&copy; 2026 AeroBook. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
