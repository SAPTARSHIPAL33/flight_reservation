<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — AeroBook</title>
  <meta name="description" content="Create your AeroBook account and start booking flights in seconds." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              400: '#599fff', 500: '#3478ff',
              600: '#1b57f5', 700: '#1443e1',
            },
            surface: {
              800: '#1e293b', 900: '#0f172a', 950: '#020617',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #ffffff !important; }

    .page-bg {
      background: #ffffff !important;
      min-height: 100vh;
    }
    .page-bg::before {
      display: none;
    }

    .glass {
      background: #0f172a;
      border: 1px solid #1e293b;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
    }

    .auth-input {
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      color: #fff;
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      outline: none;
    }
    .auth-input::placeholder { color: rgba(203,213,225,0.35); }
    .auth-input:focus {
      border-color: #3478ff;
      box-shadow: 0 0 0 3px rgba(52,120,255,0.25);
    }

    /* Input without icon (mob_no optional label) */
    .auth-input-bare {
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      color: #fff;
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      outline: none;
    }
    .auth-input-bare::placeholder { color: rgba(203,213,225,0.35); }
    .auth-input-bare:focus {
      border-color: #3478ff;
      box-shadow: 0 0 0 3px rgba(52,120,255,0.25);
    }

    .btn-primary {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #1b57f5, #3478ff);
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 20px rgba(52,120,255,0.3);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(52,120,255,0.4);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .card-enter {
      animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>

<body class="page-bg flex flex-col items-center justify-center px-4 py-12">

  <!-- Brand link -->
  <a href="index.html" id="brand-link" class="flex items-center gap-2 mb-8 group">
    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/25">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.125A59.768 59.768 0 0121.485 12 59.768 59.768 0 013.27 20.875L5.999 12zm0 0h7.5"/>
      </svg>
    </div>
    <span class="text-xl font-bold text-slate-900 tracking-tight">Aero<span class="text-brand-600">Book</span></span>
  </a>

  <!-- Redirect notice if coming from a successful signup redirect -->
  <div id="registered-notice"
       class="hidden items-center gap-2 mb-5 px-4 py-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-sm max-w-md w-full">
    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    Account created! Please log in below.
  </div>

  <!-- Card -->
  <div class="card-enter glass rounded-2xl w-full max-w-md p-8 shadow-2xl shadow-black/40">

    <!-- Heading -->
    <div class="mb-7 text-center">
      <h1 class="text-2xl font-bold text-white">Create your account</h1>
      <p class="text-sm text-slate-400 mt-1">Start booking flights in seconds</p>
    </div>

    <!-- Error Banner -->
    <div id="auth-error"
         class="hidden items-start gap-3 mb-5 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-sm">
      <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span></span>
    </div>

    <!-- Signup Form -->
    <form id="signup-form" novalidate>

      <!-- Full Name -->
      <div class="mb-4">
        <label for="signup-name" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Full Name <span class="text-red-400">*</span></label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-brand-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </span>
          <input
            type="text"
            id="signup-name"
            name="name"
            required
            autocomplete="name"
            placeholder="Your full name"
            class="auth-input"
          />
        </div>
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label for="signup-email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email <span class="text-red-400">*</span></label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-brand-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </span>
          <input
            type="email"
            id="signup-email"
            name="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
            class="auth-input"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="signup-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password <span class="text-red-400">*</span></label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-brand-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </span>
          <input
            type="password"
            id="signup-password"
            name="password"
            required
            autocomplete="new-password"
            placeholder="Min. 6 characters"
            class="auth-input"
          />
        </div>
      </div>

      <!-- Mobile (Optional) -->
      <div class="mb-6">
        <label for="signup-mob" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          Mobile Number <span class="text-slate-600 font-normal normal-case">(optional)</span>
        </label>
        <input
          type="tel"
          id="signup-mob"
          name="mob_no"
          autocomplete="tel"
          placeholder="+91 98765 43210"
          class="auth-input-bare"
        />
      </div>

      <!-- Submit -->
      <button type="submit" id="signup-btn" class="btn-primary">
        Create Account
      </button>
    </form>

    <!-- Toggle to Login -->
    <p class="mt-6 text-center text-sm text-slate-400">
      Already have an account?
      <a href="login.html" id="goto-login" class="font-semibold text-brand-400 hover:text-white transition-colors ml-1">Log in</a>
    </p>
  </div>

  <p class="mt-8 text-xs text-slate-500">&copy; 2026 AeroBook. All rights reserved.</p>

  <script src="js/auth.js"></script>
</body>
</html>
